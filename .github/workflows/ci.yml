name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    if: github.repository != 'stevenfackley/repo-template-dotnet10-aot'
    uses: stevenfackley/gh-actions/.github/workflows/ci-dotnet.yml@v1
    with:
      project-name: "{{PROJECT_NAME}}"
    secrets: inherit
