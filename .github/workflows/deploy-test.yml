name: deploy-test

on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  # CI-cost guard: a Dependabot auto-merge was fully checked on its PR; skipping the root
  # job here skips the dependent deploy. Those bumps ship with the next human merge or a
  # manual dispatch. Non-workflow_run events are never skipped.
  build-push:
    if: ${{ (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') && github.repository != 'stevenfackley/repo-template-dotnet10-aot' && (github.event_name != 'workflow_run' || github.event.workflow_run.head_commit.author.username != 'dependabot[bot]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      short-sha: ${{ steps.bp.outputs.short-sha }}
      image-ref: ${{ steps.bp.outputs.image-ref }}
    steps:
      - uses: actions/checkout@v7
      - id: bp
        uses: stevenfackley/gh-actions/.github/actions/docker-build-push@v1
        with:
          image-name: ${{ github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    needs: build-push
    if: github.repository != 'stevenfackley/repo-template-dotnet10-aot'
    # Switch uses: line below to match {{DEPLOY_TARGET}}. Default shown: ec2-ssh.
    uses: stevenfackley/gh-actions/.github/workflows/deploy-ec2-ssh.yml@v1
    with:
      image-ref: ${{ needs.build-push.outputs.image-ref }}
      environment: test
      health-url: http://localhost:8080/health
      container-name: "{{PROJECT_NAME}}"
    secrets: inherit
